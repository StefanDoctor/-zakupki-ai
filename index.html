<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Закупки AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f6f8;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.app{
  max-width:600px;
  margin:auto;
  padding:20px
}

h1{
  font-size:28px;
  margin:8px 0
}

h2{
  font-size:21px;
  margin:8px 0 14px
}

p{
  color:#666;
  line-height:1.45
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 2px 10px rgba(0,0,0,.06)
}

input,textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-family:inherit;
  outline:none
}

textarea{
  min-height:100px;
  resize:vertical
}

input:focus,textarea:focus{
  border-color:#888
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  background:#111;
  color:#fff
}

button.secondary{
  background:#eee;
  color:#111
}

.option{
  background:#fff;
  border:1px solid #ddd;
  color:#111;
  text-align:left;
  margin:8px 0;
  padding:14px;
  border-radius:13px
}

.small{
  font-size:14px;
  color:#777
}

.success{
  background:#eef9f0;
  color:#176b2c;
  border-radius:12px;
  padding:12px;
  margin-top:12px
}

.error{
  background:#fff0f0;
  color:#a11;
  border-radius:12px;
  padding:12px;
  margin-top:12px
}

.tag{
  display:inline-block;
  background:#f0f1f3;
  border-radius:8px;
  padding:5px 8px;
  margin:3px;
  font-size:13px
}
</style>
</head>

<body>

<div class="app">

  <h1>Закупки AI</h1>

  <div id="app"></div>

</div>

<script>

let catalog = [];
let stage = "start";
let selectedProduct = null;
let selectedForm = null;
let selectedPackage = null;
let quantity = null;
let requirements = "";
let originalRequest = "";


/* =========================
   НОРМАЛИЗАЦИЯ ТЕКСТА
========================= */

function normalizeText(text){
  return String(text || "")
    .toLowerCase()
    .replace(/ё/g,"е")
    .replace(/[^а-яa-z0-9]+/gi," ")
    .replace(/\s+/g," ")
    .trim();
}


/* =========================
   ЗАГРУЗКА КАТАЛОГА
========================= */

async function loadCatalog(){

  try{

    const response = await fetch(
      "catalog.json?v=" + Date.now(),
      {
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("Ошибка загрузки каталога");
    }

    const data = await response.json();

    catalog = Array.isArray(data.catalog)
      ? data.catalog
      : [];

  }catch(error){

    console.error(error);

    catalog = [];

  }

}


/* =========================
   ПОИСК ПО ОФИЦИАЛЬНЫМ
   НАЗВАНИЯМ
========================= */

function findCatalogMatches(text){

  const query = normalizeText(text);

  if(!query){
    return [];
  }

  return catalog.filter(item => {

    const fields = [
      item.brand,
      item.family,
      item.variant,
      item.active_ingredient
    ];

    return fields.some(field => {

      const value = normalizeText(field);

      return value &&
        (
          query.includes(value) ||
          value.includes(query)
        );

    });

  });

}


/* =========================
   ПОИСК ПО ALIASES
========================= */

function findAliasMatches(text){

  const query = normalizeText(text);

  if(!query){
    return [];
  }

  return catalog.filter(item => {

    if(!Array.isArray(item.aliases)){
      return false;
    }

    return item.aliases.some(alias => {

      const normalizedAlias = normalizeText(alias);

      return normalizedAlias === query;

    });

  });

}


/* =========================
   ПОИСК АЛИАСА ВНУТРИ
   БОЛЕЕ ДЛИННОЙ ФРАЗЫ
========================= */

function findAliasInsideText(text){

  const query = normalizeText(text);

  if(!query){
    return [];
  }

  return catalog.filter(item => {

    if(!Array.isArray(item.aliases)){
      return false;
    }

    return item.aliases.some(alias => {

      const normalizedAlias = normalizeText(alias);

      if(normalizedAlias.length < 3){
        return false;
      }

      return query.includes(normalizedAlias);

    });

  });

}


/* =========================
   ОТОБРАЖЕНИЕ
========================= */

function render(html){

  document.getElementById("app").innerHTML = html;

}


/* =========================
   СТАРТОВАЯ СТРАНИЦА
========================= */

function showStart(){

  stage = "start";
  selectedProduct = null;
  selectedForm = null;
  selectedPackage = null;
  quantity = null;
  requirements = "";

  render(`

    <div class="card">

      <h2>Новая закупка</h2>

      <p>
        Что вам нужно купить? Опишите своими словами.
      </p>

      <textarea
        id="request"
        placeholder="Например: синий ультракаин, 3 упаковки"
      ></textarea>

      <button onclick="processRequest()">
        Продолжить
      </button>

    </div>

  `);

}


/* =========================
   ОБРАБОТКА ЗАПРОСА
========================= */

function processRequest(){

  const input = document.getElementById("request");

  const text = input
    ? input.value.trim()
    : "";

  if(!text){
    return;
  }

  originalRequest = text;

  /*
    Сначала ищем точный alias.

    Например:
    "синий ультракаин"
    "зелёный ультракаин"
  */

  let aliasMatches = findAliasMatches(text);

  /*
    Если точного совпадения нет,
    ищем alias внутри фразы.

    Например:
    "мне нужен синий ультракаин"
  */

  if(aliasMatches.length === 0){

    aliasMatches = findAliasInsideText(text);

  }

  /*
    Если найден ровно один alias —
    считаем товар однозначно определённым.
  */

  if(aliasMatches.length === 1){

    selectedProduct = aliasMatches[0];

    showProductConfirmation();

    return;

  }


  /*
    Если alias не дал результата,
    ищем по официальному названию.
  */

  const matches = findCatalogMatches(text);

  if(matches.length === 1){

    selectedProduct = matches[0];

    showProductConfirmation();

    return;

  }

  if(matches.length > 1){

    showVariants(matches);

    return;

  }

  /*
    Если ничего не нашли.
  */

  render(`

    <div class="card">

      <h2>Не удалось найти товар</h2>

      <p>
        Я пока не смогла однозначно сопоставить
        ваш запрос с каталогом.
      </p>

      <p>
        Попробуйте указать название, цвет,
        производителя или другие характеристики.
      </p>

      <button onclick="showStart()">
        Назад
      </button>

    </div>

  `);

}


/* =========================
   ПОКАЗ ВАРИАНТОВ
========================= */

function showVariants(matches){

  let html = `

    <div class="card">

      <h2>Я нашла несколько вариантов.</h2>

      <p>
        Уточните, какой именно нужен:
      </p>

  `;

  matches.forEach((item,index)=>{

    html += `

      <button
        class="option"
        onclick="selectVariant(${index})"
      >

        <strong>${escapeHtml(item.family || item.brand)}</strong><br>

        ${escapeHtml(item.variant || "")}

        ${
          item.active_ingredient
            ? `<div class="small">
                ${escapeHtml(item.active_ingredient)}
               </div>`
            : ""
        }

    `;

    html += `</button>`;

  });

  html += `

      <button
        class="secondary"
        onclick="showStart()"
      >
        Назад
      </button>

    </div>

  `;

  window.currentMatches = matches;

  render(html);

}


/* =========================
   ВЫБОР ВАРИАНТА
========================= */

function selectVariant(index){

  const item = window.currentMatches[index];

  if(!item){
    return;
  }

  selectedProduct = item;

  showProductConfirmation();

}


/* =========================
   ПОДТВЕРЖДЕНИЕ ТОВАРА
========================= */

function showProductConfirmation(){

  if(!selectedProduct){
    return;
  }

  const item = selectedProduct;

  render(`

    <div class="card">

      <h2>Товар определён</h2>

      <p>

        <strong>
          ${escapeHtml(item.brand || "")}
        </strong><br>

        ${escapeHtml(item.family || "")}<br>

        ${escapeHtml(item.variant || "")}

      </p>

      ${
        item.active_ingredient
          ? `
            <div class="small">
              ${escapeHtml(item.active_ingredient)}
            </div>
          `
          : ""
      }

      <div class="success">
        Товар сопоставлен с каталогом.
      </div>

      <button onclick="showForms()">
        Продолжить
      </button>

      <button
        class="secondary"
        onclick="showStart()"
      >
        Изменить запрос
      </button>

    </div>

  `);

}


/* =========================
   ФОРМЫ ТОВАРА
========================= */

function showForms(){

  const forms = selectedProduct.forms || [];

  if(forms.length === 1){

    selectedForm = forms[0];

    showPackages();

    return;

  }

  let html = `

    <div class="card">

      <h2>Какая форма нужна?</h2>

  `;

  forms.forEach((form,index)=>{

    html += `

      <button
        class="option"
        onclick="selectForm(${index})"
      >

        ${escapeHtml(form.form)}

        ${
          form.volume_ml
            ? `<div class="small">
                ${form.volume_ml} мл
               </div>`
            : ""
        }

    </button>

    `;

  });

  html += `

      <button
        class="secondary"
        onclick="showProductConfirmation()"
      >
        Назад
      </button>

    </div>

  `;

  window.currentForms = forms;

  render(html);

}


/* =========================
   ВЫБОР ФОРМЫ
========================= */

function selectForm(index){

  selectedForm = window.currentForms[index];

  showPackages();

}


/* =========================
   УПАКОВКА
========================= */

function showPackages(){

  if(!selectedForm){
    return;
  }

  /*
    Если у формы только один вариант упаковки,
    сразу выбираем его.
  */

  selectedPackage = selectedForm;

  showQuantity();

}


/* =========================
   КОЛИЧЕСТВО
========================= */

function showQuantity(){

  const packageQuantity =
    selectedPackage.package_quantity || 1;

  const packageUnit =
    selectedPackage.package_unit || "штук";

  render(`

    <div class="card">

      <h2>Количество</h2>

      <p>

        ${escapeHtml(selectedForm.form || "")}

        ${
          selectedForm.volume_ml
            ? `, ${selectedForm.volume_ml} мл`
            : ""
        }

        <br>

        В упаковке:
        ${packageQuantity}
        ${escapeHtml(packageUnit)}

      </p>

      <input
        id="quantity"
        type="number"
        min="1"
        step="1"
        placeholder="Количество упаковок"
      >

      <button onclick="saveQuantity()">
        Продолжить
      </button>

      <button
        class="secondary"
        onclick="showForms()"
      >
        Назад
      </button>

    </div>

  `);

}


/* =========================
   СОХРАНЕНИЕ КОЛИЧЕСТВА
========================= */

function saveQuantity(){

  const input = document.getElementById("quantity");

  const value = Number(input.value);

  if(!value || value < 1){
    return;
  }

  quantity = value;

  showRequirements();

}


/* =========================
   ТРЕБОВАНИЯ
========================= */

function showRequirements(){

  render(`

    <div class="card">

      <h2>Дополнительные требования</h2>

      <p>
        Например: хороший срок годности,
        конкретный производитель или доставка.
      </p>

      <textarea
        id="requirements"
        placeholder="Можно оставить пустым"
      ></textarea>

      <button onclick="finishRequest()">
        Сформировать заявку
      </button>

    </div>

  `);

}


/* =========================
   ФИНАЛЬНАЯ ЗАЯВКА
========================= */

function finishRequest(){

  const input =
    document.getElementById("requirements");

  requirements =
    input
      ? input.value.trim()
      : "";

  const item = selectedProduct;

  const packageQuantity =
    selectedPackage.package_quantity || 1;

  const packageUnit =
    selectedPackage.package_unit || "штук";

  render(`

    <div class="card">

      <h2>Заявка готова</h2>

      <div class="success">
        Проверено AI
      </div>

      <p>

        <strong>Что купить:</strong><br>

        ${escapeHtml(item.brand || "")}
        ${escapeHtml(item.family || "")}
        — ${escapeHtml(item.variant || "")}

        <br>

        ${escapeHtml(selectedForm.form || "")}

        ${
          selectedForm.volume_ml
            ? `, ${selectedForm.volume_ml} мл`
            : ""
        }

        <br>

        В упаковке:
        ${packageQuantity}
        ${escapeHtml(packageUnit)}

        <br><br>

        <strong>
          Количество:
        </strong>

        ${formatQuantity(quantity)}

      </p>

      ${
        requirements
          ? `
            <p>
              <strong>Требования:</strong><br>
              ${escapeHtml(requirements)}
            </p>
          `
          : ""
      }

      <div class="success">
        Товар сопоставлен с каталогом.
      </div>

      <button onclick="sendToSuppliers()">
        Отправить поставщикам
      </button>

      <button
        class="secondary"
        onclick="showStart()"
      >
        Новая закупка
      </button>

    </div>

  `);

}


/* =========================
   ОТПРАВКА ПОСТАВЩИКАМ
========================= */

function sendToSuppliers(){

  render(`

    <div class="card">

      <h2>Заявка отправлена</h2>

      <div class="success">

        Заявка направлена подходящим поставщикам.

      </div>

      <p>
        Когда поставщики ответят,
        здесь появятся их предложения.
      </p>

      <button onclick="showStart()">
        Новая закупка
      </button>

    </div>

  `);

}


/* =========================
   ФОРМАТ КОЛИЧЕСТВА
========================= */

function formatQuantity(n){

  n = Number(n);

  const lastTwo = n % 100;
  const last = n % 10;

  if(lastTwo >= 11 && lastTwo <= 14){
    return n + " упаковок";
  }

  if(last === 1){
    return n + " упаковка";
  }

  if(last >= 2 && last <= 4){
    return n + " упаковки";
  }

  return n + " упаковок";

}


/* =========================
   БЕЗОПАСНЫЙ ВЫВОД ТЕКСТА
========================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   ЗАПУСК
========================= */

(async function(){

  await loadCatalog();

  showStart();

})();

</script>

</body>
</html>
