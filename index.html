<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Закупки AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
      color: #111827;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      background: white;
      padding: 24px 18px;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: 30px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 17px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #eef0f3;
      color: #111827;
    }

    .order {
      display: none;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      resize: vertical;
      margin: 12px 0;
    }

    .back {
      background: transparent;
      text-align: left;
      padding: 5px 0;
      margin-bottom: 15px;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #f3f4f6;
      border-radius: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <section id="home">
    <h1>Закупки AI</h1>
    <div class="subtitle">
      Умные закупки для клиник
    </div>

    <button class="primary" onclick="newOrder()">
      ＋ Новый заказ
    </button>

    <button class="secondary">
      Мои заказы
    </button>

    <button class="secondary">
      Торги
    </button>

    <button class="secondary">
      История
    </button>
  </section>

  <section id="order" class="order">

    <button class="back" onclick="goHome()">
      ← Назад
    </button>

    <h1>Новый заказ</h1>

    <div class="subtitle">
      Напишите обычными словами, что необходимо купить.
    </div>

    <textarea id="request"
      placeholder="Например: нужно 20 коробок перчаток M, 10 упаковок масок и 5 упаковок игл Septoject..."></textarea>

    <button class="primary" onclick="createOrder()">
      Создать заявку
    </button>

    <div id="result" class="result"></div>

  </section>

</div>

<script>
  function newOrder() {
    document.getElementById("home").style.display = "none";
    document.getElementById("order").style.display = "block";
  }

  function goHome() {
    document.getElementById("order").style.display = "none";
    document.getElementById("home").style.display = "block";
  }

  function createOrder() {
    const request = document.getElementById("request").value.trim();
    const result = document.getElementById("result");

    if (!request) {
      alert("Введите, что необходимо купить.");
      return;
    }

    result.style.display = "block";
    result.innerHTML =
      "<strong>Заявка создана.</strong><br><br>" +
      "Содержание заявки:<br>" +
      request +
      "<br><br>" +
      "Следующий этап — отправка заявки поставщикам.";
  }
</script>

</body>
</html>
