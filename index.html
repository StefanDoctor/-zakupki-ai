<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Закупки AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f6f8;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.app{
  max-width:600px;
  margin:auto;
  padding:20px
}

h1{
  font-size:28px;
  margin:8px 0
}

h2{
  font-size:21px;
  margin:8px 0 14px
}

p{
  color:#666;
  line-height:1.45
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 2px 10px rgba(0,0,0,.06)
}

input,textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-family:inherit;
  outline:none
}

textarea{
  min-height:100px;
  resize:vertical
}

input:focus,textarea:focus{
  border-color:#888
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  background:#111;
  color:#fff
}

button.secondary{
  background:#eee;
  color:#111
}

button.green{
  background:#238636
}

button.red{
  background:#d33
}

button.blue{
  background:#1769aa
}

.option{
  background:#fff;
  border:1px solid #ddd;
  color:#111;
  text-align:left;
  margin:8px 0;
  padding:14px;
  border-radius:13px
}

.small{
  font-size:14px;
  color:#777
}

.success{
  background:#eef9f0;
  color:#176b2c;
  border-radius:12px;
  padding:12px;
  margin-top:12px
}

.summary{
  background:#f5f6f8;
  border-radius:12px;
  padding:14px;
  margin-top:12px
}

.offer{
  border:1px solid #ddd;
  border-radius:14px;
  padding:15px;
  margin:12px 0;
  background:#fff
}
</style>
</head>

<body>

<div class="app">

<h1>Закупки AI</h1>

<div id="app"></div>

</div>

<script>

/* =====================================================
   СОСТОЯНИЕ ПРИЛОЖЕНИЯ
===================================================== */

let catalog=[];

let selectedProduct=null;
let selectedForm=null;
let selectedPackage=null;

let quantity=null;
let requirements="";

let currentMatches=[];
let currentForms=[];

/* Заявка, которую отправили поставщикам */
let procurementRequest=null;

/* Предложения поставщиков */
let supplierOffers=[];


/* =====================================================
   НОРМАЛИЗАЦИЯ
===================================================== */

function normalizeText(text){

  return String(text||"")
    .toLowerCase()
    .replace(/ё/g,"е")
    .replace(/[^а-яa-z0-9]+/gi," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =====================================================
   ЗАГРУЗКА КАТАЛОГА
===================================================== */

async function loadCatalog(){

  try{

    const response=await fetch(
      "catalog.json?v="+Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("Ошибка загрузки каталога");
    }

    const data=await response.json();

    catalog=Array.isArray(data.catalog)
      ? data.catalog
      : [];

  }catch(error){

    console.error(error);

    catalog=[];

  }

}


/* =====================================================
   ПОИСК
===================================================== */

function findCatalogMatches(text){

  const query=normalizeText(text);

  if(!query) return [];

  return catalog.filter(item=>{

    const fields=[
      item.brand,
      item.family,
      item.variant,
      item.active_ingredient
    ];

    return fields.some(field=>{

      const value=normalizeText(field);

      return value &&
        (
          query.includes(value) ||
          value.includes(query)
        );

    });

  });

}


function findAliasMatches(text){

  const query=normalizeText(text);

  if(!query) return [];

  return catalog.filter(item=>{

    if(!Array.isArray(item.aliases)){
      return false;
    }

    return item.aliases.some(alias=>
      normalizeText(alias)===query
    );

  });

}


function findAliasInsideText(text){

  const query=normalizeText(text);

  if(!query) return [];

  return catalog.filter(item=>{

    if(!Array.isArray(item.aliases)){
      return false;
    }

    return item.aliases.some(alias=>{

      const normalized=normalizeText(alias);

      if(normalized.length<4){
        return false;
      }

      return query.includes(normalized);

    });

  });

}


/* =====================================================
   RENDER
===================================================== */

function render(html){

  document.getElementById("app").innerHTML=html;

}


/* =====================================================
   КЛИНИКА — НАЧАЛО
===================================================== */

function showStart(){

  selectedProduct=null;
  selectedForm=null;
  selectedPackage=null;

  quantity=null;
  requirements="";

  render(`

    <div class="card">

      <h2>Новая закупка</h2>

      <p>
        Что вам нужно купить? Опишите своими словами.
      </p>

      <textarea
        id="request"
        placeholder="Например: синий ультракаин, 3 упаковки"
      ></textarea>

      <button onclick="processRequest()">
        Продолжить
      </button>

    </div>

    <div class="card">

      <h2>Тест системы</h2>

      <button
        class="secondary"
        onclick="showSupplierMode()"
      >
        Открыть режим поставщика
      </button>

    </div>

  `);

}


/* =====================================================
   ОБРАБОТКА ЗАПРОСА
===================================================== */

function processRequest(){

  const input=document.getElementById("request");

  const text=input ? input.value.trim() : "";

  if(!text) return;


  let matches=findAliasMatches(text);

  if(matches.length===0){
    matches=findAliasInsideText(text);
  }

  if(matches.length===1){

    selectedProduct=matches[0];

    showProductConfirmation();

    return;

  }


  matches=findCatalogMatches(text);


  if(matches.length===1){

    selectedProduct=matches[0];

    showProductConfirmation();

    return;

  }


  if(matches.length>1){

    showVariants(matches);

    return;

  }


  render(`

    <div class="card">

      <h2>Не удалось найти товар</h2>

      <p>
        Я пока не смогла однозначно сопоставить
        ваш запрос с каталогом.
      </p>

      <button onclick="showStart()">
        Назад
      </button>

    </div>

  `);

}


/* =====================================================
   ВАРИАНТЫ
===================================================== */

function showVariants(matches){

  currentMatches=matches;

  let html=`

    <div class="card">

      <h2>Я нашла несколько вариантов.</h2>

      <p>
        Уточните, какой именно нужен:
      </p>

  `;


  matches.forEach((item,index)=>{

    html+=`

      <button
        class="option"
        onclick="selectVariant(${index})"
      >

        <strong>
          ${escapeHtml(item.family||item.brand)}
        </strong>

        <br>

        ${escapeHtml(item.variant||"")}

      </button>

    `;

  });


  html+=`

      <button
        class="secondary"
        onclick="showStart()"
      >
        Назад
      </button>

    </div>

  `;

  render(html);

}


function selectVariant(index){

  selectedProduct=currentMatches[index];

  showProductConfirmation();

}


/* =====================================================
   ТОВАР
===================================================== */

function showProductConfirmation(){

  const item=selectedProduct;

  render(`

    <div class="card">

      <h2>Товар определён</h2>

      <div class="summary">

        <strong>
          ${escapeHtml(item.brand||"")}
        </strong>

        <br>

        ${escapeHtml(item.family||"")}

        <br>

        ${escapeHtml(item.variant||"")}

      </div>

      <div class="success">
        Товар сопоставлен с каталогом.
      </div>

      <button onclick="showForms()">
        Продолжить
      </button>

      <button
        class="secondary"
        onclick="showStart()"
      >
        Изменить запрос
      </button>

    </div>

  `);

}


/* =====================================================
   ФОРМА
===================================================== */

function showForms(){

  const forms=
    Array.isArray(selectedProduct.forms)
      ? selectedProduct.forms
      : [];


  if(forms.length===1){

    selectedForm=forms[0];

    showPackages();

    return;

  }


  currentForms=forms;


  let html=`

    <div class="card">

      <h2>Какая форма нужна?</h2>

  `;


  forms.forEach((form,index)=>{

    html+=`

      <button
        class="option"
        onclick="selectForm(${index})"
      >

        <strong>
          ${escapeHtml(form.form||"")}
        </strong>

        ${
          form.volume_ml
            ? `
              <div class="small">
                ${form.volume_ml} мл
              </div>
            `
            :""
        }

      </button>

    `;

  });


  html+=`

      <button
        class="secondary"
        onclick="showProductConfirmation()"
      >
        Назад
      </button>

    </div>

  `;


  render(html);

}


function selectForm(index){

  selectedForm=currentForms[index];

  showPackages();

}


/* =====================================================
   УПАКОВКА
===================================================== */

function showPackages(){

  selectedPackage=selectedForm;

  showQuantity();

}


/* =====================================================
   КОЛИЧЕСТВО
===================================================== */

function showQuantity(){

  const formName=selectedForm?.form||"";

  const volume=selectedForm?.volume_ml
    ? `${selectedForm.volume_ml} мл`
    : "";

  const packageQuantity=
    selectedPackage?.package_quantity||1;


  render(`

    <div class="card">

      <h2>Количество</h2>

      <div class="summary">

        <strong>
          ${escapeHtml(formName)}
        </strong>

        ${
          volume
            ? `, ${escapeHtml(volume)}`
            :""
        }

        <br>

        В упаковке:
        ${packageQuantity} шт.

      </div>

      <input
        id="quantity"
        type="number"
        min="1"
        step="1"
        value="3"
        placeholder="Количество упаковок"
      >

      <button onclick="saveQuantity()">
        Продолжить
      </button>

      <button
        class="secondary"
        onclick="showForms()"
      >
        Назад
      </button>

    </div>

  `);

}


function saveQuantity(){

  const value=Number(
    document.getElementById("quantity").value
  );

  if(!value || value<1){
    return;
  }

  quantity=value;

  showRequirements();

}


/* =====================================================
   ТРЕБОВАНИЯ
===================================================== */

function showRequirements(){

  render(`

    <div class="card">

      <h2>Дополнительные требования</h2>

      <p>
        Например: хороший срок годности,
        конкретный производитель или доставка.
      </p>

      <textarea
        id="requirements"
        placeholder="Можно оставить пустым"
      ></textarea>

      <button onclick="finishRequest()">
        Сформировать заявку
      </button>

    </div>

  `);

}


/* =====================================================
   ФОРМИРОВАНИЕ ЗАЯВКИ
===================================================== */

function finishRequest(){

  const input=
    document.getElementById("requirements");

  requirements=
    input ? input.value.trim() : "";


  procurementRequest={

    id:"REQ-"+Date.now(),

    product:selectedProduct,

    form:selectedForm,

    package:selectedPackage,

    quantity:quantity,

    requirements:requirements,

    status:"sent",

    createdAt:new Date().toISOString()

  };


  renderClinicRequest();

}


/* =====================================================
   ЗАЯВКА КЛИНИКИ
===================================================== */

function renderClinicRequest(){

  const item=procurementRequest.product;

  const form=procurementRequest.form;

  const packageData=procurementRequest.package;


  render(`

    <div class="card">

      <h2>Заявка готова</h2>

      <div class="success">
        Проверено AI
      </div>

      <div class="summary">

        <strong>Что купить:</strong>

        <br><br>

        ${escapeHtml(item.brand||"")}
        ${escapeHtml(item.family||"")}

        — ${escapeHtml(item.variant||"")}

        <br>

        ${escapeHtml(form.form||"")}

        ${
          form.volume_ml
            ? `, ${form.volume_ml} мл`
            :""
        }

        <br>

        В упаковке:
        ${packageData.package_quantity||1} шт.

        <br><br>

        <strong>
          Количество:
        </strong>

        ${formatQuantity(procurementRequest.quantity)}

      </div>


      ${
        procurementRequest.requirements
          ? `
            <p>
              <strong>Требования:</strong><br>
              ${escapeHtml(procurementRequest.requirements)}
            </p>
          `
          :""
      }


      <div class="success">
        Товар сопоставлен с каталогом.
      </div>

      <button onclick="sendToSuppliers()">
        Отправить поставщикам
      </button>

      <button
        class="secondary"
        onclick="showStart()"
      >
        Новая закупка
      </button>

    </div>

  `);

}


/* =====================================================
   ОТПРАВКА ПОСТАВЩИКАМ
===================================================== */

function sendToSuppliers(){

  if(!procurementRequest){
    return;
  }

  procurementRequest.status="sent_to_suppliers";

  showSupplierMode();

}


/* =====================================================
   РЕЖИМ ПОСТАВЩИКА
===================================================== */

function showSupplierMode(){

  if(!procurementRequest){

    render(`

      <div class="card">

        <h2>Режим поставщика</h2>

        <p>
          Сейчас нет активной заявки.
        </p>

        <button
          class="secondary"
          onclick="showStart()"
        >
          Назад
        </button>

      </div>

    `);

    return;

  }


  const item=procurementRequest.product;

  const form=procurementRequest.form;

  const packageData=procurementRequest.package;


  render(`

    <div class="card">

      <h2>Новая заявка</h2>

      <div class="summary">

        <strong>
          ${escapeHtml(item.brand||"")}
          ${escapeHtml(item.family||"")}
        </strong>

        <br>

        ${escapeHtml(item.variant||"")}

        <br>

        ${escapeHtml(form.form||"")}

        ${
          form.volume_ml
            ? `, ${form.volume_ml} мл`
            :""
        }

        <br>

        ${formatQuantity(procurementRequest.quantity)}

        <br>

        В упаковке:
        ${packageData.package_quantity||1} шт.

      </div>


      ${
        procurementRequest.requirements
          ? `
            <p>
              <strong>Требования клиники:</strong><br>
              ${escapeHtml(procurementRequest.requirements)}
            </p>
          `
          :""
      }

    </div>


    <div class="card">

      <h2>Ваш ответ</h2>

      <button
        class="green"
        onclick="showSupplierOfferForm()"
      >
        💰 Дать цену
      </button>

      <button
        class="red"
        onclick="supplierCannotSupply()"
      >
        ❌ Не могу поставить
      </button>

      <button
        class="blue"
        onclick="supplierClarify()"
      >
        ❓ Уточнить возможность
      </button>

    </div>


    <div class="card">

      <button
        class="secondary"
        onclick="showClinicOffers()"
      >
        Вернуться к клинике
      </button>

    </div>

  `);

}


/* =====================================================
   ПОСТАВЩИК — ДАТЬ ЦЕНУ
===================================================== */

function showSupplierOfferForm(){

  render(`

    <div class="card">

      <h2>Предложение поставщика</h2>

      <p>
        Укажите условия поставки.
      </p>

      <input
        id="offerPrice"
        type="number"
        min="0"
        placeholder="Цена товара, ₽"
      >

      <input
        id="deliveryCost"
        type="number"
        min="0"
        placeholder="Стоимость доставки, ₽"
      >

      <input
        id="deliveryTime"
        type="text"
        placeholder="Срок поставки, например: 5 дней"
      >

      <button onclick="submitSupplierOffer()">
        Отправить предложение
      </button>

      <button
        class="secondary"
        onclick="showSupplierMode()"
      >
        Назад
      </button>

    </div>

  `);

}


/* =====================================================
   ОТПРАВКА ПРЕДЛОЖЕНИЯ
===================================================== */

function submitSupplierOffer(){

  const price=
    Number(document.getElementById("offerPrice").value);

  const deliveryCost=
    Number(document.getElementById("deliveryCost").value);

  const deliveryTime=
    document.getElementById("deliveryTime").value.trim();


  if(
    !price ||
    price<0 ||
    !deliveryTime
  ){
    return;
  }


  const offer={

    id:"OFFER-"+Date.now(),

    supplierName:"Поставщик №1",

    price:price,

    deliveryCost:
      Number.isFinite(deliveryCost)
        ? deliveryCost
        : 0,

    deliveryTime:deliveryTime,

    status:"new"

  };


  supplierOffers.push(offer);

  procurementRequest.status="offer_received";

  showSupplierOfferSent();

}


/* =====================================================
   ПРЕДЛОЖЕНИЕ ОТПРАВЛЕНО
===================================================== */

function showSupplierOfferSent(){

  render(`

    <div class="card">

      <h2>Предложение отправлено</h2>

      <div class="success">

        Клиника получила ваше предложение.

      </div>

      <button onclick="showClinicOffers()">
        Открыть предложения клиники
      </button>

    </div>

  `);

}


/* =====================================================
   ПОСТАВЩИК — НЕ МОГУ ПОСТАВИТЬ
===================================================== */

function supplierCannotSupply(){

  procurementRequest.status="supplier_cannot_supply";


  render(`

    <div class="card">

      <h2>Ответ отправлен</h2>

      <div class="success">
        Поставщик сообщил,
        что не может выполнить заявку.
      </div>

      <button onclick="showClinicOffers()">
        Вернуться к клинике
      </button>

    </div>

  `);

}


/* =====================================================
   ПОСТАВЩИК — УТОЧНИТЬ
===================================================== */

function supplierClarify(){

  procurementRequest.status="clarification_requested";


  render(`

    <div class="card">

      <h2>Запрос отправлен</h2>

      <p>
        Поставщик запросил уточнение возможности поставки.
      </p>

      <button onclick="showClinicOffers()">
        Вернуться к клинике
      </button>

    </div>

  `);

}


/* =====================================================
   ПРЕДЛОЖЕНИЯ ДЛЯ КЛИНИКИ
===================================================== */

function showClinicOffers(){

  if(!procurementRequest){

    showStart();

    return;

  }


  if(supplierOffers.length===0){

    render(`

      <div class="card">

        <h2>Предложения</h2>

        <p>
          Пока нет предложений поставщиков.
        </p>

        <button onclick="showSupplierMode()">
          Открыть режим поставщика
        </button>

        <button
          class="secondary"
          onclick="showStart()"
        >
          Новая закупка
        </button>

      </div>

    `);

    return;

  }


  let html=`

    <div class="card">

      <h2>Получены предложения</h2>

      <p>
        Выберите подходящее предложение.
      </p>

  `;


  supplierOffers.forEach((offer,index)=>{

    const total=
      offer.price+offer.deliveryCost;


    html+=`

      <div class="offer">

        <strong>
          ${escapeHtml(offer.supplierName)}
        </strong>

        <br><br>

        Цена товара:
        ${formatMoney(offer.price)}

        <br>

        Доставка:
        ${formatMoney(offer.deliveryCost)}

        <br>

        <strong>
          Итого:
          ${formatMoney(total)}
        </strong>

        <br>

        Срок:
        ${escapeHtml(offer.deliveryTime)}

        <button
          class="green"
          onclick="selectOffer(${index})"
        >
          Выбрать предложение
        </button>

      </div>

    `;

  });


  html+=`

      <button
        class="secondary"
        onclick="showSupplierMode()"
      >
        Режим поставщика
      </button>

    </div>

  `;


  render(html);

}


/* =====================================================
   ВЫБОР ПРЕДЛОЖЕНИЯ
===================================================== */

function selectOffer(index){

  const offer=supplierOffers[index];

  if(!offer){
    return;
  }

  offer.status="selected";

  procurementRequest.status="supplier_selected";

  render(`

    <div class="card">

      <h2>Предложение выбрано</h2>

      <div class="success">

        Вы выбрали ${escapeHtml(offer.supplierName)}.

      </div>

      <div class="summary">

        Цена:
        ${formatMoney(offer.price)}

        <br>

        Доставка:
        ${formatMoney(offer.deliveryCost)}

        <br>

        <strong>
          Итого:
          ${formatMoney(
            offer.price+offer.deliveryCost
          )}
        </strong>

        <br>

        Срок:
        ${escapeHtml(offer.deliveryTime)}

      </div>

      <button
        class="green"
        onclick="confirmOrder()"
      >
        Подтвердить заказ
      </button>

      <button
        class="secondary"
        onclick="showClinicOffers()"
      >
        Назад к предложениям
      </button>

    </div>

  `);

}


/* =====================================================
   ПОДТВЕРЖДЕНИЕ ЗАКАЗА
===================================================== */

function confirmOrder(){

  procurementRequest.status="order_confirmed";

  const selected=
    supplierOffers.find(
      offer=>offer.status==="selected"
    );


  render(`

    <div class="card">

      <h2>Заказ подтверждён</h2>

      <div class="success">

        Заказ передан поставщику.

      </div>

      ${
        selected
          ? `
            <div class="summary">

              Поставщик:
              ${escapeHtml(selected.supplierName)}

              <br>

              Итого:
              ${formatMoney(
                selected.price+
                selected.deliveryCost
              )}

              <br>

              Срок:
              ${escapeHtml(selected.deliveryTime)}

            </div>
          `
          :""
      }


      <button onclick="supplierAcceptOrder()">
        Открыть заказ поставщика
      </button>

    </div>

  `);

}


/* =====================================================
   ПОСТАВЩИК — ПРИНЯТЬ ЗАКАЗ
===================================================== */

function supplierAcceptOrder(){

  procurementRequest.status="accepted_by_supplier";


  render(`

    <div class="card">

      <h2>Заказ поставщику</h2>

      <div class="summary">

        Заказ:
        ${escapeHtml(
          procurementRequest.product.family||""
        )}

        <br>

        Количество:
        ${formatQuantity(
          procurementRequest.quantity
        )}

      </div>

      <button
        class="green"
        onclick="finishOrder()"
      >
        ✅ Принять заказ
      </button>

      <button
        class="red"
        onclick="rejectOrder()"
      >
        ❌ Не могу выполнить
      </button>

    </div>

  `);

}


/* =====================================================
   ЗАКАЗ ЗАВЕРШЁН
===================================================== */

function finishOrder(){

  procurementRequest.status="accepted";

  render(`

    <div class="card">

      <h2>Заказ принят</h2>

      <div class="success">

        Поставщик подтвердил выполнение заказа.

      </div>

      <button onclick="showStart()">
        Новая закупка
      </button>

    </div>

  `);

}


/* =====================================================
   ПОСТАВЩИК НЕ МОЖЕТ ВЫПОЛНИТЬ
===================================================== */

function rejectOrder(){

  procurementRequest.status="rejected_by_supplier";

  render(`

    <div class="card">

      <h2>Заказ не принят</h2>

      <p>
        Поставщик сообщил,
        что не может выполнить заказ.
      </p>

      <button onclick="showClinicOffers()">
        Вернуться к предложениям
      </button>

    </div>

  `);

}


/* =====================================================
   ФОРМАТ ДЕНЕГ
===================================================== */

function formatMoney(value){

  return Number(value||0).toLocaleString("ru-RU")
    +" ₽";

}


/* =====================================================
   ФОРМАТ КОЛИЧЕСТВА
===================================================== */

function formatQuantity(n){

  n=Number(n);

  const lastTwo=n%100;
  const last=n%10;


  if(lastTwo>=11 && lastTwo<=14){
    return n+" упаковок";
  }

  if(last===1){
    return n+" упаковка";
  }

  if(last>=2 && last<=4){
    return n+" упаковки";
  }

  return n+" упаковок";

}


/* =====================================================
   БЕЗОПАСНЫЙ ВЫВОД
===================================================== */

function escapeHtml(value){

  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   ЗАПУСК
===================================================== */

(async function(){

  await loadCatalog();

  showStart();

})();
