<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Закупки AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f6f8;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
  max-width:600px;
  margin:auto;
  padding:20px;
}

h1{
  font-size:28px;
  margin:8px 0;
}

h2{
  font-size:21px;
  margin:8px 0 14px;
}

p{
  color:#666;
  line-height:1.45;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

textarea,
input{
  width:100%;
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  font-family:inherit;
  outline:none;
}

textarea{
  resize:none;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:10px;
  font-size:16px;
  font-weight:600;
  background:#111;
  color:white;
}

button.secondary{
  background:#e9eaed;
  color:#111;
}

button.green{
  background:#16833b;
}

.hidden{
  display:none;
}

.chat{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:15px;
}

.message{
  max-width:88%;
  padding:12px 14px;
  border-radius:16px;
  line-height:1.4;
}

.ai{
  background:#eef1f5;
  align-self:flex-start;
}

.user{
  background:#111;
  color:white;
  align-self:flex-end;
}

.summary{
  background:#f7f7f7;
  border-radius:14px;
  padding:14px;
  margin-top:12px;
}

.small{
  font-size:14px;
  color:#777;
}

.badge{
  display:inline-block;
  background:#eef1f5;
  padding:6px 10px;
  border-radius:10px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<!-- ГЛАВНЫЙ ЭКРАН -->

<div id="home">

  <h1>Закупки AI</h1>

  <p>
    Опишите своими словами, что нужно купить.
    AI уточнит недостающие данные и подготовит заявку.
  </p>

  <div class="card">

    <button onclick="openClinic()">
      🏥 Начать закупку
    </button>

    <button class="secondary" onclick="openSupplier()">
      📦 Я поставщик
    </button>

  </div>

</div>


<!-- КЛИНИКА -->

<div id="clinic" class="hidden">

  <h1>Новая закупка</h1>

  <div class="card">

    <div id="chat" class="chat"></div>

    <div id="inputArea">

      <textarea
        id="userInput"
        rows="3"
        placeholder="Например: нужны чёрные нитриловые перчатки M">
      </textarea>

      <button onclick="sendMessage()">
        Отправить
      </button>

    </div>

  </div>

  <button class="secondary" onclick="goHome()">
    ← Назад
  </button>

</div>


<!-- ПОСТАВЩИК -->

<div id="supplier" class="hidden">

  <h1>📦 Поставщик</h1>

  <div class="card">

    <span class="badge">Новая заявка</span>

    <h2>Запрос от клиники</h2>

    <p>
      Нужны 20 упаковок чёрных нитриловых перчаток,
      размер M.
    </p>

    <button onclick="showSupplierOffer()">
      💰 Дать цену
    </button>

    <button class="secondary">
      ❓ Уточнить возможность
    </button>

    <button class="secondary">
      ❌ Не могу поставить
    </button>

  </div>

  <div id="supplierOffer" class="card hidden">

    <h2>Ваше предложение</h2>

    <input
      id="supplierPrice"
      type="number"
      placeholder="Цена товара, ₽">

    <input
      id="supplierDelivery"
      type="number"
      placeholder="Доставка, ₽"
      style="margin-top:10px">

    <input
      id="supplierTime"
      placeholder="Срок доставки"
      style="margin-top:10px">

    <button class="green" onclick="sendSupplierOffer()">
      Отправить предложение
    </button>

  </div>

  <button class="secondary" onclick="goHome()">
    ← Назад
  </button>

</div>


<!-- РЕЗУЛЬТАТ -->

<div id="result" class="hidden">

  <h1>Заявка готова</h1>

  <div class="card">

    <span class="badge">Проверено AI</span>

    <div id="resultText" class="summary"></div>

    <button class="green">
      📤 Отправить поставщикам
    </button>

  </div>

  <button class="secondary" onclick="goHome()">
    ← Главное меню
  </button>

</div>


</div>


<script>

let stage = "start";

let request = {
  product:"",
  quantity:"",
  unit:"",
  details:""
};


function hideAll(){

  document.getElementById("home").classList.add("hidden");
  document.getElementById("clinic").classList.add("hidden");
  document.getElementById("supplier").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");

}


function goHome(){

  hideAll();

  document.getElementById("home").classList.remove("hidden");

  stage="start";

  request={
    product:"",
    quantity:"",
    unit:"",
    details:""
  };

  document.getElementById("chat").innerHTML="";

}


function openClinic(){

  hideAll();

  document.getElementById("clinic").classList.remove("hidden");

  stage="start";

  addAI(
    "Что вам нужно купить? Опишите своими словами."
  );

}


function openSupplier(){

  hideAll();

  document.getElementById("supplier").classList.remove("hidden");

}


function addAI(text){

  const chat=document.getElementById("chat");

  const div=document.createElement("div");

  div.className="message ai";

  div.innerText=text;

  chat.appendChild(div);

}


function addUser(text){

  const chat=document.getElementById("chat");

  const div=document.createElement("div");

  div.className="message user";

  div.innerText=text;

  chat.appendChild(div);

}


function sendMessage(){

  const input=document.getElementById("userInput");

  const text=input.value.trim();

  if(!text) return;

  addUser(text);

  input.value="";

  processMessage(text);

}


function processMessage(text){

  /*
    ЭТО ПОКА НЕ НАСТОЯЩИЙ AI.
    Здесь мы проверяем сам сценарий.
  */

  if(stage==="start"){

    request.product=text;

    stage="quantity";

    addAI(
      "Хорошо. А сколько вам нужно?"
    );

    return;

  }


  if(stage==="quantity"){

    const number=text.match(/\d+(?:[.,]\d+)?/);

    if(!number){

      addAI(
        "Мне нужно количество. Например: 20 упаковок, 5 штук или 2 коробки."
      );

      return;

    }

    request.quantity=number[0];

    const lower=text.toLowerCase();

    if(lower.includes("упаков")){

      request.unit="упаковок";

    }else if(lower.includes("короб")){

      request.unit="коробок";

    }else if(lower.includes("шт")){

      request.unit="штук";

    }else if(lower.includes("штук")){

      request.unit="штук";

    }else if(lower.includes("литр")){

      request.unit="литров";

    }else if(lower.includes("кг")){

      request.unit="кг";

    }else{

      stage="unit";

      addAI(
        "Количество понял. В каких единицах: штук, упаковок, коробок, литров, кг или другое?"
      );

      return;

    }

    stage="details";

    addAI(
      "Есть ли важные характеристики товара: размер, цвет, модель, производитель или другие требования?"
    );

    return;

  }


  if(stage==="unit"){

    request.unit=text;

    stage="details";

    addAI(
      "Есть ли важные характеристики товара: размер, цвет, модель, производитель или другие требования?"
    );

    return;

  }


  if(stage==="details"){

    const lower=text.toLowerCase();

    if(
      lower==="нет" ||
      lower==="нету" ||
      lower==="неважно" ||
      lower==="не важно"
    ){

      request.details="Без дополнительных требований";

    }else{

      request.details=text;

    }

    showResult();

  }

}


function showResult(){

  hideAll();

  document.getElementById("result").classList.remove("hidden");

  document.getElementById("resultText").innerHTML=

    "<b>Что купить:</b><br>"+
    escapeHtml(request.product)+
    "<br><br>"+

    "<b>Количество:</b><br>"+
    escapeHtml(request.quantity)+" "+
    escapeHtml(request.unit)+
    "<br><br>"+

    "<b>Требования:</b><br>"+
    escapeHtml(request.details);

}


function escapeHtml(text){

  const div=document.createElement("div");

  div.innerText=text;

  return div.innerHTML;

}


function showSupplierOffer(){

  document
    .getElementById("supplierOffer")
    .classList.remove("hidden");

}


function sendSupplierOffer(){

  const price=document.getElementById("supplierPrice").value;

  const delivery=document.getElementById("supplierDelivery").value || 0;

  const time=document.getElementById("supplierTime").value || "не указан";

  if(!price){

    alert("Укажите цену товара.");

    return;

  }

  alert(
    "Предложение отправлено.\n\n"+
    "Цена: "+price+" ₽\n"+
    "Доставка: "+delivery+" ₽\n"+
    "Срок: "+time
  );

}

</script>

</body>
</html>
