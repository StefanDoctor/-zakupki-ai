<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Закупки AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:16px;
  background:#f4f5f7;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
.container{max-width:650px;margin:auto}
h1{font-size:25px;margin:5px 0 8px}
h2{font-size:20px;margin:8px 0 14px}
p{line-height:1.45}
.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.06)
}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:9px;
  font-size:16px;
  font-weight:600;
  background:#1683ff;
  color:white
}
button.secondary{background:#e9eef5;color:#111}
button.danger{background:#e84b4b}
button.success{background:#21a366}
label{
  display:block;
  font-weight:600;
  margin:13px 0 6px
}
input,textarea,select{
  width:100%;
  border:1px solid #d5d9df;
  border-radius:10px;
  padding:12px;
  font-size:16px;
  background:white
}
textarea{min-height:100px;resize:vertical}
.small{font-size:14px;color:#666}
.muted{color:#777}
.price{font-size:20px;font-weight:700}
.offer{
  border:1px solid #dfe3e8;
  border-radius:14px;
  padding:14px;
  margin-top:10px
}
.badge{
  display:inline-block;
  background:#eef5ff;
  color:#1769aa;
  padding:5px 8px;
  border-radius:8px;
  font-size:13px;
  margin-bottom:8px
}
.warning{
  background:#fff5d8;
  border-radius:12px;
  padding:12px;
  margin-top:10px
}
.hidden{display:none}
</style>
</head>

<body>
<div class="container">

  <div id="app"></div>

</div>

<script>

const tg = window.Telegram?.WebApp;
if(tg){
  tg.ready();
  tg.expand();
}

let catalog = null;

let mode = "clinic";

let procurementRequest = null;

let supplierOffers = [];

let selectedProduct = null;
let selectedCategory = null;
let selectedForm = null;
let selectedProductVariant = null;

let editingOfferIndex = null;

const app = document.getElementById("app");


async function loadCatalog(){

  try{

    const response = await fetch(
      "catalog.json?v="+Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok)
      throw new Error("Не удалось загрузить catalog.json");

    catalog = await response.json();

    showStart();

  }catch(error){

    app.innerHTML = `
      <div class="card">
        <h2>Ошибка загрузки каталога</h2>
        <p>${escapeHtml(error.message)}</p>
      </div>
    `;

  }

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");

}


function normalize(text){

  return String(text || "")
    .toLowerCase()
    .replaceAll("ё","е")
    .replace(/[.,!?;:()[\]{}"']/g," ")
    .replace(/\s+/g," ")
    .trim();

}


function showStart(){

  mode="clinic";

  app.innerHTML=`

    <div class="card">

      <h1>Закупки AI</h1>

      <p>
        Опишите, что нужно купить.
        Система попробует определить товар,
        его характеристики и необходимые уточнения.
      </p>

      <label>Что вам нужно?</label>

      <textarea
        id="requestText"
        placeholder="Например: нужен синий Ультракаин, 3 упаковки, срок годности не менее 1,5 года"
      ></textarea>

      <button onclick="processRequest()">
        Найти товар
      </button>

    </div>

    <div class="card">

      <button class="secondary" onclick="showSupplierMode()">
        Режим поставщика
      </button>

    </div>

  `;

}


function findExactAlias(text){

  const n=normalize(text);

  const matches=[];

  for(const category of catalog.categories){

    for(const product of category.products || []){

      for(const alias of product.aliases || []){

        if(n === normalize(alias)){

          matches.push({
            category,
            product
          });

        }

      }

    }

  }

  return matches;

}


function findAliasInsideText(text){

  const n=normalize(text);

  const matches=[];

  for(const category of catalog.categories){

    for(const product of category.products || []){

      for(const alias of product.aliases || []){

        const a=normalize(alias);

        if(a.length>=4 && n.includes(a)){

          matches.push({
            category,
            product,
            alias
          });

        }

      }

    }

  }

  return matches;

}


function findNameMatches(text){

  const n=normalize(text);

  const matches=[];

  for(const category of catalog.categories){

    for(const product of category.products || []){

      const words=[
        product.brand,
        product.family,
        product.variant
      ].filter(Boolean);

      let score=0;

      for(const word of words){

        const w=normalize(word);

        if(w && n.includes(w))
          score++;

      }

      if(score>0){

        matches.push({
          category,
          product,
          score
        });

      }

    }

  }

  return matches.sort((a,b)=>b.score-a.score);

}


function detectCategory(text){

  const n=normalize(text);

  const compositeWords=[
    "композит",
    "композитный",
    "композитная",
    "filtek",
    "estelite",
    "эстелайт",
    "z250",
    "реставрационный материал"
  ];

  const anestheticWords=[
    "ультракаин",
    "анестетик",
    "анестезия",
    "карпул"
  ];

  if(compositeWords.some(x=>n.includes(normalize(x))))
    return catalog.categories.find(x=>x.id==="composites");

  if(anestheticWords.some(x=>n.includes(normalize(x))))
    return catalog.categories.find(x=>x.id==="anesthetics");

  return null;

}


function processRequest(){

  const text=document.getElementById("requestText").value.trim();

  if(!text){

    alert("Напишите, что нужно купить.");

    return;

  }

  const exact=findExactAlias(text);

  if(exact.length===1){

    selectDetectedProduct(
      exact[0].category,
      exact[0].product,
      text
    );

    return;

  }

  const inside=findAliasInsideText(text);

  if(inside.length===1){

    selectDetectedProduct(
      inside[0].category,
      inside[0].product,
      text
    );

    return;

  }

  const names=findNameMatches(text);

  if(names.length===1){

    selectDetectedProduct(
      names[0].category,
      names[0].product,
      text
    );

    return;

  }

  const category=detectCategory(text);

  if(category){

    showCategoryClarification(category,text);

    return;

  }

  showUnknownRequest(text);

}


function selectDetectedProduct(category,product,text){

  selectedCategory=category;
  selectedProduct=product;

  if(product.forms && product.forms.length>1){

    showForms(text);

    return;

  }

  if(product.forms && product.forms.length===1){

    selectedForm=product.forms[0];

  }

  showProductConfirmation(text);

}


function showForms(originalText){

  app.innerHTML=`

    <div class="card">

      <div class="badge">${escapeHtml(selectedCategory.name)}</div>

      <h2>${escapeHtml(selectedProduct.family)}</h2>

      <p>Найдены разные варианты формы. Выберите нужный.</p>

      ${selectedProduct.forms.map((form,index)=>`

        <button
          onclick="chooseForm(${index},${JSON.stringify(originalText)})"
        >
          ${escapeHtml(form.form)},
          ${escapeHtml(form.volume_ml)} мл —
          ${escapeHtml(form.package_quantity)} ${escapeHtml(form.package_unit)}
        </button>

      `).join("")}

    </div>

  `;

}


function chooseForm(index,originalText){

  selectedForm=selectedProduct.forms[index];

  showProductConfirmation(originalText);

}


function showProductConfirmation(originalText){

  const p=selectedProduct;

  let html=`

    <div class="card">

      <div class="badge">${escapeHtml(selectedCategory.name)}</div>

      <h2>${escapeHtml(p.family)}</h2>

      ${p.variant ? `<p><b>Вариант:</b> ${escapeHtml(p.variant)}</p>` : ""}

      ${p.active_ingredient ? `<p><b>Действующее вещество:</b> ${escapeHtml(p.active_ingredient)}</p>` : ""}

      ${selectedForm ? `
        <p>
          <b>Форма:</b> ${escapeHtml(selectedForm.form)}<br>
          <b>Объём:</b> ${escapeHtml(selectedForm.volume_ml)} мл<br>
          <b>В упаковке:</b> ${escapeHtml(selectedForm.package_quantity)} ${escapeHtml(selectedForm.package_unit)}
        </p>
      ` : ""}

      <p class="small">
        Запрос: ${escapeHtml(originalText)}
      </p>

    </div>

  `;

  if(selectedCategory.id==="composites"){

    html+=`

      <div class="card">

        <h2>Уточните параметры</h2>

        <label>Оттенок</label>
        <input id="shade" placeholder="Например: A2">

        <label>Фасовка</label>
        <input id="formValue" placeholder="Например: шприц 4 г">

        <label>Консистенция / тип</label>
        <input id="consistency" placeholder="Если имеет значение">

        <label>Назначение</label>
        <input id="purpose" placeholder="Например: боковые зубы">

        <button onclick="finishProductDetails(${JSON.stringify(originalText)})">
          Продолжить
        </button>

      </div>

    `;

  }else{

    html+=`

      <div class="card">

        <label>Количество упаковок</label>

        <input
          id="quantity"
          type="number"
          min="1"
          value="3"
        >

        <label>Дополнительные требования</label>

        <textarea
          id="requirements"
          placeholder="Например: срок годности не менее 1,5 года"
        ></textarea>

        <button onclick="finishProductDetails(${JSON.stringify(originalText)})">
          Сформировать заявку
        </button>

      </div>

    `;

  }

  app.innerHTML=html;

}


function showCategoryClarification(category,text){

  selectedCategory=category;

  app.innerHTML=`

    <div class="card">

      <div class="badge">${escapeHtml(category.name)}</div>

      <h2>Нужно немного уточнить</h2>

      <p>
        По вашему запросу система определила категорию,
        но конкретный товар пока определить нельзя.
      </p>

      ${category.clarificationQuestions
        .map(q=>`<p>• ${escapeHtml(q)}</p>`)
        .join("")}

      <label>Уточните требования</label>

      <textarea id="categoryDetails"
        placeholder="Например: Filtek Z250, оттенок A2, шприцы 4 г, 5 штук"
      ></textarea>

      <button onclick="processCategoryDetails(${JSON.stringify(text)})">
        Продолжить
      </button>

    </div>

  `;

}


function processCategoryDetails(originalText){

  const details=document.getElementById("categoryDetails").value.trim();

  if(!details){

    alert("Укажите хотя бы несколько характеристик.");

    return;

  }

  const combined=originalText+" "+details;

  const matches=findNameMatches(combined);

  if(matches.length){

    selectDetectedProduct(
      matches[0].category,
      matches[0].product,
      combined
    );

    return;

  }

  showGenericCategoryRequest(combined);

}


function showGenericCategoryRequest(text){

  app.innerHTML=`

    <div class="card">

      <div class="badge">${escapeHtml(selectedCategory.name)}</div>

      <h2>Заявка на подбор</h2>

      <p>
        Конкретный товар в каталоге пока не найден.
        Это нормально: заявку можно отправить поставщикам
        как запрос на подбор.
      </p>

      <p>
        <b>Ваш запрос:</b><br>
        ${escapeHtml(text)}
      </p>

      <label>Количество</label>

      <input id="quantity" type="number" min="1" value="1">

      <label>Дополнительные требования</label>

      <textarea id="requirements"></textarea>

      <button onclick="finishGenericRequest(${JSON.stringify(text)})">
        Отправить заявку
      </button>

    </div>

  `;

}


function finishProductDetails(originalText){

  let details={};

  if(selectedCategory.id==="composites"){

    details.shade=document.getElementById("shade").value.trim();
    details.form=document.getElementById("formValue").value.trim();
    details.consistency=document.getElementById("consistency").value.trim();
    details.purpose=document.getElementById("purpose").value.trim();

    const quantity=1;

    procurementRequest={
      id:"REQ-"+Date.now(),
      category:selectedCategory,
      product:selectedProduct,
      form:selectedForm,
      quantity,
      details,
      requirements:originalText,
      status:"sent",
      createdAt:new Date().toISOString()
    };

  }else{

    const quantity=parseInt(
      document.getElementById("quantity").value,
      10
    ) || 1;

    const requirements=document
      .getElementById("requirements")
      .value
      .trim();

    procurementRequest={
      id:"REQ-"+Date.now(),
      category:selectedCategory,
      product:selectedProduct,
      form:selectedForm,
      quantity,
      details:{},
      requirements,
      status:"sent",
      createdAt:new Date().toISOString()
    };

  }

  sendToSuppliers();

}


function finishGenericRequest(text){

  const quantity=parseInt(
    document.getElementById("quantity").value,
    10
  ) || 1;

  const requirements=document
    .getElementById("requirements")
    .value
    .trim();

  procurementRequest={
    id:"REQ-"+Date.now(),
    category:selectedCategory,
    product:null,
    form:null,
    quantity,
    details:{},
    requirements:text+" "+requirements,
    status:"sent",
    createdAt:new Date().toISOString()
  };

  sendToSuppliers();

}


function requestDescription(){

  if(!procurementRequest)
    return "";

  const r=procurementRequest;

  let result="";

  if(r.product){

    result+=r.product.family;

    if(r.product.variant)
      result+=" — "+r.product.variant;

  }else{

    result+=r.category.name;

  }

  if(r.form){

    result+=
      ", "+
      r.form.form+
      ", "+
      r.form.volume_ml+
      " мл";

  }

  if(r.details){

    if(r.details.shade)
      result+="; оттенок: "+r.details.shade;

    if(r.details.form)
      result+="; фасовка: "+r.details.form;

    if(r.details.consistency)
      result+="; тип: "+r.details.consistency;

    if(r.details.purpose)
      result+="; назначение: "+r.details.purpose;

  }

  return result;

}


function sendToSuppliers(){

  procurementRequest.status="sent";

  showSupplierMode();

}


function showSupplierMode(){

  mode="supplier";

  if(!procurementRequest){

    app.innerHTML=`

      <div class="card">

        <h2>Режим поставщика</h2>

        <p class="muted">
          Здесь будет отображаться заявка клиники,
          когда она будет направлена поставщику.
        </p>

        <button class="secondary" onclick="showStart()">
          Вернуться к клинике
        </button>

      </div>

    `;

    return;

  }

  renderSupplierRequest();

}


function renderSupplierRequest(){

  const r=procurementRequest;

  let offerHtml="";

  if(supplierOffers.length){

    const offer=supplierOffers[0];

    offerHtml=`

      <div class="card">

        <h2>Ваше предложение</h2>

        <p><b>Цена:</b> ${escapeHtml(offer.price)} ₽</p>

        <p><b>Доставка:</b> ${escapeHtml(offer.deliveryCost || "не указана")} ₽</p>

        <p><b>Срок поставки:</b> ${escapeHtml(offer.deliveryTime)}</p>

        <p><b>Срок годности:</b> ${escapeHtml(offer.expiry || "не указан")}</p>

        ${
          offer.comment
          ? `<p><b>Дополнительно:</b> ${escapeHtml(offer.comment)}</p>`
          : ""
        }

        <button onclick="editSupplierOffer(0)">
          ✏️ Изменить предложение
        </button>

      </div>

    `;

  }

  app.innerHTML=`

    <div class="card">

      <div class="badge">Заявка ${escapeHtml(r.id)}</div>

      <h2>Запрос клиники</h2>

      <p><b>Товар:</b> ${escapeHtml(requestDescription())}</p>

      <p><b>Количество:</b> ${escapeHtml(r.quantity)}</p>

      ${
        r.requirements
        ? `
          <div class="warning">
            <b>Требования клиники:</b><br>
            ${escapeHtml(r.requirements)}
          </div>
        `
        : ""
      }

    </div>

    ${
      supplierOffers.length
      ? offerHtml
      : `
        <div class="card">

          <h2>Ваш ответ</h2>

          <button onclick="showSupplierOfferForm()">
            💰 Дать цену
          </button>

          <button class="secondary" onclick="supplierCannotSupply()">
            ❌ Не могу поставить
          </button>

          <button class="secondary" onclick="supplierAskQuestion()">
            ❓ Уточнить возможность
          </button>

        </div>
      `
    }

    <div class="card">

      <button class="secondary" onclick="showStart()">
        Вернуться в режим клиники
      </button>

    </div>

  `;

}


function showSupplierOfferForm(editIndex=null){

  editingOfferIndex=editIndex;

  const old=
    editIndex!==null
    ? supplierOffers[editIndex]
    : null;

  const fields=
    selectedCategory?.supplierFields ||
    [
      {
        id:"price",
        label:"Цена товара",
        type:"number",
        required:true
      },
      {
        id:"deliveryCost",
        label:"Стоимость доставки",
        type:"number",
        required:false
      },
      {
        id:"deliveryTime",
        label:"Срок поставки",
        type:"text",
        required:true
      },
      {
        id:"expiry",
        label:"Срок годности",
        type:"text",
        required:false
      },
      {
        id:"comment",
        label:"Дополнительная информация",
        type:"textarea",
        required:false
      }
    ];

  let fieldsHtml="";

  for(const field of fields){

    const value=old?.[field.id] || "";

    if(field.type==="textarea"){

      fieldsHtml+=`

        <label>${escapeHtml(field.label)}</label>

        <textarea
          id="offer_${escapeHtml(field.id)}"
          placeholder="${escapeHtml(field.placeholder || "")}"
        >${escapeHtml(value)}</textarea>

      `;

    }else{

      fieldsHtml+=`

        <label>
          ${escapeHtml(field.label)}
          ${field.required ? " *" : ""}
        </label>

        <input
          id="offer_${escapeHtml(field.id)}"
          type="${field.type==="number" ? "number" : "text"}"
          value="${escapeHtml(value)}"
          placeholder="${escapeHtml(field.placeholder || "")}"
        >

      `;

    }

  }

  app.innerHTML=`

    <div class="card">

      <h2>
        ${
          editIndex!==null
          ? "Изменение предложения"
          : "Предложение поставщика"
        }
      </h2>

      <p>
        <b>Заявка:</b>
        ${escapeHtml(requestDescription())}
      </p>

      ${
        procurementRequest.requirements
        ? `
          <div class="warning">
            <b>Требование клиники:</b><br>
            ${escapeHtml(procurementRequest.requirements)}
          </div>
        `
        : ""
      }

      ${fieldsHtml}

      <button onclick="submitSupplierOffer()">
        ${editIndex!==null ? "Сохранить изменения" : "Отправить предложение"}
      </button>

      <button class="secondary" onclick="renderSupplierRequest()">
        Отмена
      </button>

    </div>

  `;

}


function submitSupplierOffer(){

  const price=document
    .getElementById("offer_price")
    ?.value
    .trim();

  const deliveryCost=document
    .getElementById("offer_deliveryCost")
    ?.value
    .trim();

  const deliveryTime=document
    .getElementById("offer_deliveryTime")
    ?.value
    .trim();

  const expiry=document
    .getElementById("offer_expiry")
    ?.value
    .trim();

  const comment=document
    .getElementById("offer_comment")
    ?.value
    .trim();

  if(!price){

    alert("Укажите цену товара.");

    return;

  }

  if(!deliveryTime){

    alert("Укажите срок поставки.");

    return;

  }

  const offer={
    id:
      editingOfferIndex!==null
      ? supplierOffers[editingOfferIndex].id
      : "OFFER-"+Date.now(),

    supplierName:"Поставщик №1",

    price,
    deliveryCost,
    deliveryTime,
    expiry,
    comment,

    status:"new",
    updatedAt:new Date().toISOString()
  };

  if(editingOfferIndex!==null){

    supplierOffers[editingOfferIndex]=offer;

  }else{

    supplierOffers.push(offer);

  }

  editingOfferIndex=null;

  procurementRequest.status="offers_received";

  showClinicOffers();

}


function editSupplierOffer(index){

  showSupplierOfferForm(index);

}


function showClinicOffers(){

  mode="clinic";

  app.innerHTML=`

    <div class="card">

      <h2>Предложения поставщиков</h2>

      <p>
        По заявке получено предложений:
        <b>${supplierOffers.length}</b>
      </p>

    </div>

    ${supplierOffers.map((offer,index)=>`

      <div class="card offer">

        <div class="badge">
          ${escapeHtml(offer.supplierName)}
        </div>

        <p class="price">
          ${escapeHtml(offer.price)} ₽
        </p>

        <p>
          <b>Доставка:</b>
          ${escapeHtml(offer.deliveryCost || "не указана")} ₽
        </p>

        <p>
          <b>Срок поставки:</b>
          ${escapeHtml(offer.deliveryTime)}
        </p>

        <p>
          <b>Срок годности:</b>
          ${escapeHtml(offer.expiry || "не указан")}
        </p>

        ${
          offer.comment
          ? `<p><b>Дополнительно:</b> ${escapeHtml(offer.comment)}</p>`
          : ""
        }

        <button
          class="success"
          onclick="selectOffer(${index})"
        >
          Выбрать это предложение
        </button>

      </div>

    `).join("")}

    <div class="card">

      <button class="secondary" onclick="showSupplierMode()">
        Открыть режим поставщика
      </button>

    </div>

  `;

}


function selectOffer(index){

  procurementRequest.selectedOffer=
    supplierOffers[index];

  procurementRequest.status="selected";

  app.innerHTML=`

    <div class="card">

      <h2>Предложение выбрано</h2>

      <p>
        Вы выбрали поставщика:
        <b>${escapeHtml(
          supplierOffers[index].supplierName
        )}</b>
      </p>

      <p class="price">
        ${escapeHtml(supplierOffers[index].price)} ₽
      </p>

      <button onclick="confirmOrder()">
        Подтвердить заказ
      </button>

    </div>

  `;

}


function confirmOrder(){

  procurementRequest.status="order_confirmed";

  app.innerHTML=`

    <div class="card">

      <h2>Заказ подтверждён</h2>

      <p>
        Заказ передан выбранному поставщику.
      </p>

      <button onclick="supplierAcceptOrder()">
        Открыть режим поставщика
      </button>

    </div>

  `;

}


function supplierAcceptOrder(){

  procurementRequest.status="supplier_confirmation";

  app.innerHTML=`

    <div class="card">

      <h2>Новый заказ</h2>

      <p>
        Клиника выбрала ваше предложение.
      </p>

      <p>
        <b>Товар:</b>
        ${escapeHtml(requestDescription())}
      </p>

      <button class="success" onclick="supplierConfirmOrder()">
        ✅ Принять заказ
      </button>

      <button class="danger" onclick="supplierRejectOrder()">
        ❌ Не могу выполнить
      </button>

    </div>

  `;

}


function supplierConfirmOrder(){

  procurementRequest.status="accepted";

  app.innerHTML=`

    <div class="card">

      <h2>Заказ принят</h2>

      <p>
        Поставщик подтвердил выполнение заказа.
      </p>

      <button onclick="showStart()">
        Новая закупка
      </button>

    </div>

  `;

}


function supplierRejectOrder(){

  procurementRequest.status="rejected";

  app.innerHTML=`

    <div class="card">

      <h2>Заказ отклонён</h2>

      <p>
        Поставщик сообщил, что не может выполнить заказ.
      </p>

      <button onclick="showClinicOffers()">
        Вернуться к предложениям
      </button>

    </div>

  `;

}


function supplierCannotSupply(){

  app.innerHTML=`

    <div class="card">

      <h2>Ответ поставщика</h2>

      <p>
        Вы сообщили, что не можете поставить этот товар.
      </p>

      <button onclick="showSupplierMode()">
        Вернуться к заявке
      </button>

    </div>

  `;

}


function supplierAskQuestion(){

  app.innerHTML=`

    <div class="card">

      <h2>Уточнение возможности</h2>

      <label>Что нужно уточнить?</label>

      <textarea
        id="supplierQuestion"
        placeholder="Напишите вопрос или комментарий"
      ></textarea>

      <button onclick="sendSupplierQuestion()">
        Отправить
      </button>

    </div>

  `;

}


function sendSupplierQuestion(){

  const q=document
    .getElementById("supplierQuestion")
    .value
    .trim();

  if(!q){

    alert("Напишите вопрос.");

    return;

  }

  app.innerHTML=`

    <div class="card">

      <h2>Вопрос отправлен</h2>

      <p>
        Ваш вопрос передан по заявке.
      </p>

      <button onclick="showSupplierMode()">
        Вернуться
      </button>

    </div>

  `;

}


loadCatalog();

</script>

</body>
</html>
